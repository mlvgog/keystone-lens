name: Website

# Publishes the website (site/, built by scripts/build-site.js) on GitHub Pages:
# https://mlvgog.github.io/keystone-lens/
# Needs Settings → Pages → Build and deployment → Source: "GitHub Actions", once.
# New releases need no deploy: the download buttons ask GitHub for the newest release.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - 'src/assets/icon.png'
      - 'scripts/build-site.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits instead of cancelling one that is publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts # only the Marcellus font is needed, no Electron download
      - run: node --test test/site.test.js
      - run: node scripts/build-site.js _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
