name: Release

# Push a tag like v1.0.0 (matching "version" in package.json) to build the Windows
# installer and portable exe and publish them as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Check that the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Build installer and portable exe
        run: npx electron-builder --win nsis portable --publish never
        env:
          # No certificate configured yet (see docs/RELEASING.md for code signing).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The installed app's updater (electron-updater) reads latest.yml from the newest release.
      - name: Check the update files
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test -f dist/latest.yml || { echo "dist/latest.yml is missing"; exit 1; }
          grep -q "KeystoneLens-Setup-${version}.exe" dist/latest.yml || { echo "latest.yml does not name KeystoneLens-Setup-${version}.exe"; cat dist/latest.yml; exit 1; }
          test -f "dist/KeystoneLens-Setup-${version}.exe.blockmap" || { echo "The installer's blockmap is missing"; exit 1; }
          cat dist/latest.yml

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum KeystoneLens-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        shell: bash
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else echo "Release ${GITHUB_REF_NAME}" > release-notes.md; fi

      # Published right away; notes come from docs/release-notes/<tag>.md plus the commit list.
      # latest.yml and the blockmap are for the in-app updater.
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/KeystoneLens-Setup-*.exe
            dist/KeystoneLens-Portable-*.exe
            dist/SHA256SUMS.txt
            dist/latest.yml
            dist/KeystoneLens-Setup-*.exe.blockmap
